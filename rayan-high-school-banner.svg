<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Rayan High School banner</title>
  <desc id="desc">A navy, teal, and gold school banner with an illustrated academic building and the words Rayan High School.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b36"/>
      <stop offset="1" stop-color="#123d59"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4d276"/>
      <stop offset="1" stop-color="#d9a83b"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#dots)"/>
  <circle cx="1450" cy="105" r="260" fill="#20a895" opacity=".12"/>
  <circle cx="1520" cy="570" r="330" fill="none" stroke="#f1c766" stroke-width="2" opacity=".25"/>
  <path d="M0 520 Q360 430 710 535 T1600 475 V600 H0Z" fill="#0a2b47" opacity=".72"/>
  <path d="M0 552 Q400 477 790 559 T1600 520" fill="none" stroke="#1c8b7c" stroke-width="3" opacity=".7"/>

  <!-- Academic crest -->
  <g transform="translate(205 124)">
    <path d="M125 0 235 39v87c0 78-45 133-110 164C60 259 15 204 15 126V39z" fill="#092744" stroke="url(#gold)" stroke-width="7"/>
    <path d="M125 23 213 54v71c0 62-34 107-88 136-54-29-88-74-88-136V54z" fill="#0e625f"/>
    <path d="M71 112q54-48 108 0v55q-54-42-108 0z" fill="#f7f1df"/>
    <path d="M125 112v59" stroke="#d9a83b" stroke-width="4"/>
    <path d="M62 105 125 71l63 34" fill="none" stroke="#f4d276" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M86 194h78M96 208h58" stroke="#f4d276" stroke-width="5" stroke-linecap="round"/>
    <path d="M125 6v32M109 22h32" stroke="#f4d276" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="540" y="190" fill="#f4d276" font-size="25" font-weight="700" letter-spacing="7">WELCOME TO</text>
    <text x="530" y="300" fill="#ffffff" font-size="88" font-weight="800" letter-spacing="2">RAYAN</text>
    <text x="537" y="375" fill="#ffffff" font-size="56" font-weight="300" letter-spacing="13">HIGH SCHOOL</text>
    <rect x="540" y="415" width="520" height="4" rx="2" fill="url(#gold)"/>
    <text x="540" y="469" fill="#d9e8ef" font-size="25" letter-spacing="3">LEARN  •  GROW  •  SUCCEED</text>
  </g>

  <!-- Minimal academic building illustration -->
  <g transform="translate(1190 250)" opacity=".92">
    <path d="M0 88 135 12l135 76" fill="none" stroke="#f4d276" stroke-width="7" stroke-linejoin="round"/>
    <path d="M26 92h218v150H26z" fill="#0b3451" stroke="#5cb6a6" stroke-width="4"/>
    <path d="M10 242h250" stroke="#f4d276" stroke-width="7" stroke-linecap="round"/>
    <path d="M108 152h54v90h-54z" fill="#d9a83b"/>
    <path d="M48 124h35v38H48zM187 124h35v38h-35zM48 180h35v38H48zM187 180h35v38h-35z" fill="#d5edf0"/>
    <path d="M65 124v38m-17-19h35m121-19v38m-17-19h35M65 180v38m-17-19h35m121-19v38m-17-19h35" stroke="#123d59" stroke-width="3"/>
    <path d="M119 57h32" stroke="#f4d276" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
